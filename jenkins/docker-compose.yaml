name: aohelm-jenkins

services:
  jenkins:
    build: .
    image: aohelm-jenkins:local
    container_name: aohelm-jenkins
    # root so the pipeline can use the host Docker socket
    user: root
    restart: unless-stopped
    environment:
      JAVA_OPTS: >-
        -Djenkins.install.runSetupWizard=false
        -Dhudson.plugins.git.GitSCM.ALLOW_LOCAL_CHECKOUT=true
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:?set it in jenkins/.env}
      TASKFLOW_JWT_SECRET: ${TASKFLOW_JWT_SECRET:?set it in jenkins/.env}
    ports:
      - "8090:8080"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      # the job checks out this local repo (committed state of branch main)
      - ..:/repo:ro
    networks:
      - kind

volumes:
  jenkins_home:

networks:
  # created by kind; lets Jenkins reach aohelm-test-control-plane:6443
  kind:
    external: true
