jenkins:
  systemMessage: "AoHelm CI/CD - deploys taskflow-chart to the kind cluster aohelm-test"
  numExecutors: 2
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: admin
          password: ${JENKINS_ADMIN_PASSWORD}
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

credentials:
  system:
    domainCredentials:
      - credentials:
          - string:
              scope: GLOBAL
              id: taskflow-jwt-secret
              description: JWT_SECRET for the taskflow backend
              secret: ${TASKFLOW_JWT_SECRET}

jobs:
  - script: >
      pipelineJob('taskflow') {
        description('Build, test and deploy the taskflow backend with Helm')
        properties {
          pipelineTriggers {
            triggers {
              pollSCM { scmpoll_spec('* * * * *') }
            }
          }
        }
        definition {
          cpsScm {
            scm {
              git {
                remote { url('file:///repo') }
                branch('*/main')
              }
            }
            scriptPath('Jenkinsfile')
            lightweight(false)
          }
        }
      }
