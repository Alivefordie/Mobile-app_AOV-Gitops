{{- $name := include "elk.name" (dict "root" . "component" "elasticsearch") }}
{{- $ctx := dict "root" . "component" "elasticsearch" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "elk.labels" $ctx | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: https
      port: 9200
      targetPort: https
  selector:
    {{- include "elk.selectorLabels" $ctx | nindent 4 }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels:
    {{- include "elk.labels" $ctx | nindent 4 }}
spec:
  serviceName: {{ $name }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "elk.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/elasticsearch-config.yaml") . | sha256sum }}
      labels:
        {{- include "elk.labels" $ctx | nindent 8 }}
    spec:
      securityContext:
        fsGroup: 1000
      initContainers:
        # local-path volumes ignore fsGroup; ES runs as uid 1000
        - name: fix-data-permissions
          image: "{{ .Values.elasticsearch.image }}:{{ .Values.elasticVersion }}"
          command: ["sh", "-c", "chown -R 1000:0 /usr/share/elasticsearch/data"]
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: data
              mountPath: /usr/share/elasticsearch/data
      containers:
        - name: elasticsearch
          image: "{{ .Values.elasticsearch.image }}:{{ .Values.elasticVersion }}"
          env:
            - name: ES_JAVA_OPTS
              value: {{ .Values.elasticsearch.javaOpts | quote }}
            - name: ELASTIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "elk.credentialsSecret" . }}
                  key: elastic-password
          ports:
            - name: https
              containerPort: 9200
            - name: transport
              containerPort: 9300
          readinessProbe:
            exec:
              command:
                - bash
                - -c
                - >-
                  curl -sf -o /dev/null --cacert config/certs/ca.crt -u "elastic:${ELASTIC_PASSWORD}"
                  "https://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=2s"
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: https
            initialDelaySeconds: 90
            periodSeconds: 20
          resources:
            {{- toYaml .Values.elasticsearch.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /usr/share/elasticsearch/data
            - name: config
              mountPath: /usr/share/elasticsearch/config/elasticsearch.yml
              subPath: elasticsearch.yml
            - name: certs
              mountPath: /usr/share/elasticsearch/config/certs
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ $name }}
        - name: certs
          secret:
            secretName: {{ include "elk.certsSecret" . }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.elasticsearch.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.elasticsearch.persistence.size }}
