{{- $name := include "elk.name" (dict "root" . "component" "logstash") }}
{{- $ctx := dict "root" . "component" "logstash" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "elk.labels" $ctx | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: beats
      port: 5044
      targetPort: beats
  selector:
    {{- include "elk.selectorLabels" $ctx | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "elk.labels" $ctx | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "elk.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/logstash-config.yaml") . | sha256sum }}
      labels:
        {{- include "elk.labels" $ctx | nindent 8 }}
    spec:
      initContainers:
        {{- include "elk.setupInitContainer" . | nindent 8 }}
      containers:
        - name: logstash
          image: "{{ .Values.logstash.image }}:{{ .Values.elasticVersion }}"
          env:
            - name: LS_JAVA_OPTS
              value: {{ .Values.logstash.javaOpts | quote }}
            - name: LOGSTASH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "elk.credentialsSecret" . }}
                  key: logstash-password
          ports:
            - name: beats
              containerPort: 5044
            - name: api
              containerPort: 9600
          readinessProbe:
            httpGet:
              path: /
              port: api
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: api
            initialDelaySeconds: 120
            periodSeconds: 20
          resources:
            {{- toYaml .Values.logstash.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /usr/share/logstash/config/logstash.yml
              subPath: logstash.yml
            - name: config
              mountPath: /usr/share/logstash/pipeline/logstash.conf
              subPath: logstash.conf
            - name: certs
              mountPath: /usr/share/logstash/config/certs
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ $name }}
        - name: certs
          secret:
            secretName: {{ include "elk.certsSecret" . }}
        - name: setup-script
          configMap:
            name: {{ include "elk.name" (dict "root" . "component" "setup") }}
