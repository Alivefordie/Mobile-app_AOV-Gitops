{{- /*
Nothing here is generated: under ArgoCD the chart is rendered with
`helm template`, where `lookup` returns nothing, so random values would be
replaced on every sync and stop matching what Elasticsearch has stored.

The certs Secret is never created by this chart (see scripts/create-certs.sh).
The credentials Secret is created from .Values.credentials unless
credentials.existingSecret names one created outside the chart.
*/}}
{{- if not .Values.credentials.existingSecret }}
{{- $c := .Values.credentials }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "elk.credentialsSecret" . }}
  labels:
    {{- include "elk.labels" (dict "root" . "component" "credentials") | nindent 4 }}
type: Opaque
data:
  elastic-password: {{ required "credentials.elasticPassword is required (or set credentials.existingSecret)" $c.elasticPassword | b64enc }}
  kibana-system-password: {{ required "credentials.kibanaSystemPassword is required (or set credentials.existingSecret)" $c.kibanaSystemPassword | b64enc }}
  logstash-password: {{ required "credentials.logstashPassword is required (or set credentials.existingSecret)" $c.logstashPassword | b64enc }}
  {{- if lt (len $c.kibanaEncryptionKey) 32 }}
  {{- fail "credentials.kibanaEncryptionKey must be at least 32 characters" }}
  {{- end }}
  kibana-encryption-key: {{ $c.kibanaEncryptionKey | b64enc }}
{{- end }}
