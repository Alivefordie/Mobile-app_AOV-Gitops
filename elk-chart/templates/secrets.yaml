{{- /*
Certificates and passwords are generated on first install. On upgrade the
existing Secrets are looked up and reused, so pods are not handed new
credentials on every deploy.
*/}}
{{- $certsName := include "elk.certsSecret" . }}
{{- $existingCerts := lookup "v1" "Secret" .Release.Namespace $certsName }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $certsName }}
  labels:
    {{- include "elk.labels" (dict "root" . "component" "certs") | nindent 4 }}
type: Opaque
data:
{{- if $existingCerts }}
  {{- toYaml $existingCerts.data | nindent 2 }}
{{- else }}
  {{- $esName := include "elk.name" (dict "root" . "component" "elasticsearch") }}
  {{- $ns := .Release.Namespace }}
  {{- $dns := list $esName (printf "%s.%s" $esName $ns) (printf "%s.%s.svc" $esName $ns) (printf "%s.%s.svc.cluster.local" $esName $ns) "localhost" }}
  {{- $ca := genCA "elk-ca" 3650 }}
  {{- $cert := genSignedCert $esName (list "127.0.0.1") $dns 3650 $ca }}
  ca.crt: {{ $ca.Cert | b64enc }}
  tls.crt: {{ $cert.Cert | b64enc }}
  tls.key: {{ $cert.Key | b64enc }}
{{- end }}
---
{{- $credsName := include "elk.credentialsSecret" . }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $credsName).data | default dict }}
{{- $c := .Values.credentials }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $credsName }}
  labels:
    {{- include "elk.labels" (dict "root" . "component" "credentials") | nindent 4 }}
type: Opaque
data:
  elastic-password: {{ ternary ($c.elasticPassword | b64enc) (get $existing "elastic-password" | default (randAlphaNum 24 | b64enc)) (ne $c.elasticPassword "") }}
  kibana-system-password: {{ ternary ($c.kibanaSystemPassword | b64enc) (get $existing "kibana-system-password" | default (randAlphaNum 24 | b64enc)) (ne $c.kibanaSystemPassword "") }}
  logstash-password: {{ ternary ($c.logstashPassword | b64enc) (get $existing "logstash-password" | default (randAlphaNum 24 | b64enc)) (ne $c.logstashPassword "") }}
  kibana-encryption-key: {{ ternary ($c.kibanaEncryptionKey | b64enc) (get $existing "kibana-encryption-key" | default (randAlphaNum 32 | b64enc)) (ne $c.kibanaEncryptionKey "") }}
