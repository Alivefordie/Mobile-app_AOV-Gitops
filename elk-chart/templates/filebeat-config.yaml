{{- $name := include "elk.name" (dict "root" . "component" "filebeat") }}
{{- $ctx := dict "root" . "component" "filebeat" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  labels:
    {{- include "elk.labels" $ctx | nindent 4 }}
data:
  filebeat.yml: |
    filebeat.inputs:
      - type: filestream
        id: kubernetes-container-logs
        paths:
          - /var/log/containers/*.log
        parsers:
          - container: ~
        prospector.scanner.symlinks: true
        processors:
          - add_kubernetes_metadata:
              host: ${NODE_NAME}
              matchers:
                - logs_path:
                    logs_path: "/var/log/containers/"

    processors:
      # Match on the file name (<pod>_<namespace>_<container>-<id>.log) rather
      # than kubernetes.namespace, which is missing until the metadata cache syncs.
      {{- range .Values.filebeat.excludeNamespaces }}
      - drop_event:
          when:
            regexp:
              log.file.path: {{ printf "^/var/log/containers/[^_]+_%s_" . | quote }}
      {{- end }}

    output.logstash:
      hosts: ["{{ include "elk.name" (dict "root" . "component" "logstash") }}:5044"]
