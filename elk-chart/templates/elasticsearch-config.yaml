{{- $name := include "elk.name" (dict "root" . "component" "elasticsearch") }}
{{- $ctx := dict "root" . "component" "elasticsearch" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  labels:
    {{- include "elk.labels" $ctx | nindent 4 }}
data:
  elasticsearch.yml: |
    cluster.name: aohelm-logs
    network.host: 0.0.0.0
    discovery.type: single-node
    # avoids needing vm.max_map_count=262144 on the kind node
    node.store.allow_mmap: false

    xpack.security.enabled: true
    xpack.security.http.ssl:
      enabled: true
      key: certs/tls.key
      certificate: certs/tls.crt
      certificate_authorities: ["certs/ca.crt"]
    xpack.security.transport.ssl:
      enabled: true
      verification_mode: certificate
      key: certs/tls.key
      certificate: certs/tls.crt
      certificate_authorities: ["certs/ca.crt"]
