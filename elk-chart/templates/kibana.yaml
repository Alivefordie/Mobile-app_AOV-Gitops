{{- $name := include "elk.name" (dict "root" . "component" "kibana") }}
{{- $ctx := dict "root" . "component" "kibana" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "elk.labels" $ctx | nindent 4 }}
spec:
  type: {{ .Values.kibana.service.type }}
  ports:
    - name: http
      port: {{ .Values.kibana.service.port }}
      targetPort: http
  selector:
    {{- include "elk.selectorLabels" $ctx | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "elk.labels" $ctx | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "elk.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/kibana-config.yaml") . | sha256sum }}
      labels:
        {{- include "elk.labels" $ctx | nindent 8 }}
    spec:
      initContainers:
        {{- include "elk.setupInitContainer" . | nindent 8 }}
      containers:
        - name: kibana
          image: "{{ .Values.kibana.image }}:{{ .Values.elasticVersion }}"
          env:
            - name: NODE_OPTIONS
              value: "--max-old-space-size=512"
            - name: KIBANA_SYSTEM_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "elk.credentialsSecret" . }}
                  key: kibana-system-password
            - name: KIBANA_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "elk.credentialsSecret" . }}
                  key: kibana-encryption-key
          ports:
            - name: http
              containerPort: 5601
          readinessProbe:
            httpGet:
              path: /api/status
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 180
            periodSeconds: 20
          resources:
            {{- toYaml .Values.kibana.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /usr/share/kibana/config/kibana.yml
              subPath: kibana.yml
            - name: certs
              mountPath: /usr/share/kibana/config/certs
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ $name }}
        - name: certs
          secret:
            secretName: {{ include "elk.certsSecret" . }}
        - name: setup-script
          configMap:
            name: {{ include "elk.name" (dict "root" . "component" "setup") }}
