apiVersion: v1
kind: Pod
metadata:
  name: {{ include "elk.name" (dict "root" . "component" "test-logs-indexed") }}
  labels:
    {{- include "elk.labels" (dict "root" . "component" "test") | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  restartPolicy: Never
  containers:
    - name: check
      image: "{{ .Values.setupImage }}:{{ .Values.elasticVersion }}"
      env:
        - name: ELASTIC_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "elk.credentialsSecret" . }}
              key: elastic-password
        - name: COUNT_URL
          value: "{{ include "elk.esUrl" . }}/{{ .Values.indexPrefix }}-*/_count"
      command:
        - bash
        - -c
        - |
          # Passes once Filebeat -> Logstash -> Elasticsearch has indexed at least one log line.
          for i in $(seq 1 36); do
            count=$(curl -s --cacert /certs/ca.crt -u "elastic:${ELASTIC_PASSWORD}" "${COUNT_URL}" \
              | grep -o '"count":[0-9]*' | cut -d: -f2)
            echo "indexed log lines: ${count:-none}"
            if [ "${count:-0}" -gt 0 ]; then exit 0; fi
            sleep 5
          done
          echo "no logs indexed after 3 minutes"
          exit 1
      volumeMounts:
        - name: certs
          mountPath: /certs
          readOnly: true
  volumes:
    - name: certs
      secret:
        secretName: {{ include "elk.certsSecret" . }}
