# ELK stack for collecting logs from every pod in the cluster.
#
#   Filebeat (DaemonSet) -> Logstash :5044 -> Elasticsearch :9200 (TLS) -> Kibana :5601
#
# Security is on: Elasticsearch requires a password and serves HTTPS/transport
# TLS. The chart generates neither the passwords nor the certificates.

elasticVersion: "8.19.5"

# Passwords. Nothing is generated. By default they come from a Secret created
# outside the chart (see README), with keys elastic-password,
# kibana-system-password, logstash-password, kibana-encryption-key, so they
# stay out of git. Set existingSecret to "" to take the four values below
# instead. The elastic password must match the one Elasticsearch already
# stores; changing it here does not change it there.
credentials:
  existingSecret: elk-es-credentials
  elasticPassword: ""
  kibanaSystemPassword: ""
  logstashPassword: ""
  # At least 32 characters. Changing it makes Kibana's saved encrypted objects unreadable.
  kibanaEncryptionKey: ""

# TLS for Elasticsearch, created outside the chart with scripts/create-certs.sh
# (keys: ca.crt, tls.crt, tls.key). Empty uses "<release>-tls".
certs:
  secretName: ""

# Daily indices written by Logstash, e.g. k8s-logs-2026.09.27
indexPrefix: k8s-logs

elasticsearch:
  image: docker.elastic.co/elasticsearch/elasticsearch
  javaOpts: "-Xms768m -Xmx768m"
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      memory: 1536Mi
  persistence:
    size: 5Gi
    # Empty uses the cluster's default StorageClass.
    storageClass: ""

kibana:
  image: docker.elastic.co/kibana/kibana
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi
  service:
    type: ClusterIP
    port: 5601

logstash:
  image: docker.elastic.co/logstash/logstash
  javaOpts: "-Xms256m -Xmx256m"
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 768Mi
  # Parse NestJS log lines from this namespace/container into structured fields.
  nestApp:
    namespace: taskflow
    container: taskflow-chart

filebeat:
  image: docker.elastic.co/beats/filebeat
  # Namespaces whose logs are not shipped (avoid the stack logging itself).
  excludeNamespaces:
    - logging
  resources:
    requests:
      cpu: 50m
      memory: 100Mi
    limits:
      memory: 200Mi

# Image for setup jobs/init containers (needs curl; the ES image has it).
setupImage: docker.elastic.co/elasticsearch/elasticsearch
