apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: taskflow-production
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/Pongohisut007/test-ci-cd.git
    targetRevision: main
    path: taskflow-chart

    helm:
      valueFiles:
        - values-production.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: taskflow-production

  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
