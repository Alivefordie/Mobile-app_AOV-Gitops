apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: taskflow
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/Alivefordie/test-ci-cd-gitops.git
    targetRevision: main
    path: taskflow-chart

    helm:
      valueFiles:
        - values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: taskflow

  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
