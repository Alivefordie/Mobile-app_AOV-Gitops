apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: taskflow
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/Pongohisut007/test-ci-cd.git
    targetRevision: feature/argocd
    path: taskflow-chart

    helm:
      valueFiles:
        - values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: taskflow

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
