# Expose the Argo CD UI through Traefik, like the app ingresses.
# Reachable from the PSU network: http://argocd.172.30.58.25.nip.io
#
# Traefik terminates plain HTTP here, so argocd-server must serve HTTP itself
# (server.insecure). After changing this ConfigMap, restart argocd-server:
#   kubectl -n argocd rollout restart deploy/argocd-server
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cmd-params-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-cmd-params-cm
    app.kubernetes.io/part-of: argocd
data:
  server.insecure: "true"
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-server
  namespace: argocd
spec:
  ingressClassName: traefik
  rules:
    - host: argocd.172.30.58.25.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port:
                  number: 80
