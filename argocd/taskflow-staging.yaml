apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: taskflow-staging
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/Alivefordie/test-ci-cd-gitops.git
    targetRevision: main
    path: taskflow-chart

    helm:
      valueFiles:
        - values-staging.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: taskflow-staging

  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
