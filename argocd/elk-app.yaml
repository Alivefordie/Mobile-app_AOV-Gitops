apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: elk
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/Pongohisut007/test-ci-cd.git
    targetRevision: main
    path: elk-chart

    helm:
      valueFiles:
        - values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: logging

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true