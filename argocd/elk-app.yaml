# Logging: Filebeat (this cluster, namespace "logging") -> Logstash -> Elasticsearch -> Kibana.
# Logstash, Elasticsearch and Kibana run on the Azure ELK VM (/opt/elk, docker compose),
# so only Filebeat is deployed here. It ships to Logstash at 20.196.144.165:5044 over
# mutual TLS using the certs in argocd/secrets/filebeat-logstash-certs.yaml.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: elk-filebeat
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/aovPro/Mobile-app_AOV-Gitops.git
    targetRevision: main
    path: newELK/filebeat

    helm:
      releaseName: filebeat
      valueFiles:
        - values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: logging

  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true

    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
