replicaCount: 1
image:
  repository: docker.io/pongphisut/taskflow-api
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []

nameOverride: ""

fullnameOverride: ""

containerPort: 3000

config:
  nodeEnv: production
  appEnv: production
  dbSynchronize: "true"
  jwtExpiresIn: 7d
  bcryptSaltRounds: "10"
migration:
  enabled: true
secrets:
  existingSecret: ""
  jwtSecret: change-me-in-real-deployments
  r2AccountId: ""
  r2AccessKeyId: ""
  r2SecretAccessKey: ""
  r2BucketName: ""
  # Secret created outside Git (e.g. PSU_AI_API_KEY); loaded as extra env vars
  extraEnvSecret: taskflow-extra-env
postgresql:
  enabled: true
  image:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent

  database: taskflow

  username: taskflow

  password: taskflow-password

  externalHost: ""
  port: 5432
  persistence:
    size: 1Gi
    storageClass: ""

  resources: {}
redis:
  enabled: true
  image:
    repository: redis
    tag: "7.4-alpine"
    pullPolicy: IfNotPresent

  externalUrl: ""
  port: 6379
  persistence:
    size: 512Mi
    storageClass: ""

  resources: {}
serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ""
podAnnotations: {}

podLabels: {}
podSecurityContext: {}

securityContext: {}

service:
  type: ClusterIP
  port: 80
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

resources: {}

livenessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 20
  periodSeconds: 10
readinessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
volumes: []

volumeMounts: []

nodeSelector: {}
tolerations: []
affinity: {}
