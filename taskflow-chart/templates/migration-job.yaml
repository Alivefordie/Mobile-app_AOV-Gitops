{{- if .Values.migration.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "taskflow-chart.fullname" . }}-migrate
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 600
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "taskflow-chart.serviceAccountName" . }}
      containers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ required "image.tag is required" .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["node", "dist/src/database/run-migrations.js"]
          envFrom:
            - configMapRef:
                name: {{ include "taskflow-chart.fullname" . }}
            - secretRef:
                name: {{ include "taskflow-chart.secretName" . }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
{{- end }}
