# k3s ServiceLB (klipper-lb) binds LoadBalancer ports directly on the node,
# so the app is reachable at http://<node-ip>:80 without MetalLB.
service:
  type: LoadBalancer

ports:
  web:
    expose:
      default: true
    exposedPort: 80

  websecure:
    expose:
      default: false

providers:
  kubernetesIngress:
    enabled: true

# One JSON line per request on stdout. Filebeat ships it to the Azure ELK;
# Logstash turns it into url.route / http.response.status_code / env so Kibana
# can show the endpoints that fail most often.
accessLog:
  enabled: true
  format: json
