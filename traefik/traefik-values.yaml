# k3s ServiceLB (klipper-lb) binds LoadBalancer ports directly on the node,
# so the app is reachable at http://<node-ip>:80 without MetalLB.
service:
  type: LoadBalancer

ports:
  web:
    expose:
      default: true
    exposedPort: 80

  websecure:
    expose:
      default: false

providers:
  kubernetesIngress:
    enabled: true
